name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest


  quality:
    name: Code Quality

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .


  security:
    name: Security

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run dependency security audit
        run: pip-audit


  build:
    name: Docker Build

    needs:
      - test
      - quality
      - security

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cicd-python-demo .

  container-test:
    name: Container Test

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cicd-python-demo:1.0 .

      - name: Run Docker container
        run: |
          docker run -d \
            --name cicd-python-demo-container \
            -p 8000:8000 \
            cicd-python-demo:1.0

      - name: Wait for application
        run: sleep 5

      - name: Test health endpoint
        run: curl --fail http://localhost:8000/health

      - name: Show container logs
        if: always()
        run: docker logs cicd-python-demo-container

      - name: Stop container
        if: always()
        run: docker stop cicd-python-demo-container

  image-security:
    name: Docker Image Security Scan

    needs: container-test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cicd-python-demo:1.0 .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cicd-python-demo:1.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH