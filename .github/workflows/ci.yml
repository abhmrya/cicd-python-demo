name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# Default permissions
permissions:
  contents: read
  packages: write


jobs:

  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest


  # ============================================================
  # 2. CODE QUALITY
  # ============================================================
  quality:
    name: Code Quality

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .


  # ============================================================
  # 3. DEPENDENCY SECURITY
  # ============================================================
  security:
    name: Dependency Security

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run dependency security audit
        run: pip-audit


  # ============================================================
  # 4. DOCKER BUILD
  # ============================================================
  build:
    name: Docker Build

    needs:
      - test
      - quality
      - security

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t cicd-python-demo:1.0 \
            .


  # ============================================================
  # 5. CONTAINER TEST
  # ============================================================
  container-test:
    name: Container Test

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t cicd-python-demo:1.0 \
            .

      - name: Run Docker container
        run: |
          docker run -d \
            --name cicd-python-demo-container \
            -p 8000:8000 \
            cicd-python-demo:1.0

      - name: Wait for application
        run: |
          sleep 5

      - name: Test health endpoint
        run: |
          curl --fail http://localhost:8000/health

      - name: Test root endpoint
        run: |
          curl --fail http://localhost:8000/

      - name: Show container logs
        if: always()
        run: |
          docker logs cicd-python-demo-container

      - name: Stop container
        if: always()
        run: |
          docker stop cicd-python-demo-container || true

      - name: Remove container
        if: always()
        run: |
          docker rm cicd-python-demo-container || true


  # ============================================================
  # 6. DOCKER IMAGE SECURITY SCAN
  # ============================================================
  image-security:
    name: Docker Image Security Scan

    needs: container-test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t cicd-python-demo:1.0 \
            .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cicd-python-demo:1.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH


  # ============================================================
  # 7. PUSH IMAGE TO GHCR
  # ============================================================
  push-image:
    name: Push Docker Image

    needs:
      - image-security

    # Only publish images from main.
    # Pull requests will run CI but will not publish images.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # Build image with commit SHA tag
      # --------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/cicd-python-demo:${{ github.sha }} \
            .

      # --------------------------------------------------------
      # Create latest tag
      # --------------------------------------------------------
      - name: Tag image as latest
        run: |
          docker tag \
            ghcr.io/${{ github.repository_owner }}/cicd-python-demo:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/cicd-python-demo:latest

      # --------------------------------------------------------
      # Push immutable commit image
      # --------------------------------------------------------
      - name: Push commit image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/cicd-python-demo:${{ github.sha }}

      # --------------------------------------------------------
      # Push latest image
      # --------------------------------------------------------
      - name: Push latest image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/cicd-python-demo:latest