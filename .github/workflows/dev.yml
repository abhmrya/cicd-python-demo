name: DEV Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t cicd-python-demo:dev \
            .

      - name: Start DEV container
        run: |
          docker run -d \
            --name cicd-python-demo-dev \
            -p 8000:8000 \
            cicd-python-demo:dev

      - name: Wait for application
        run: sleep 5

      - name: DEV health check
        run: |
          curl --fail http://localhost:8000/health

      - name: Show DEV response
        run: |
          curl --fail http://localhost:8000/