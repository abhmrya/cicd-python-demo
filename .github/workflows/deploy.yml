name: deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string
      extended-tests:
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # links to GitHub Environment (approvals, secrets)
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SIMULATED DEPLOY: runs the container on the runner.
      # Replace with SSH / cloud CLI for a real target (Phase 8).
      - name: Deploy ${{ inputs.environment }}
        run: |
          docker run -d --name app -p 8080:8000 \
            -e APP_ENV=${{ inputs.environment }} \
            -e APP_VERSION=${{ github.sha }} \
            "${{ inputs.image }}"

      - name: Smoke test
        run: python3 scripts/smoke_test.py http://localhost:8080 ${{ inputs.environment }}

      - name: Extended tests (performance gate)
        if: ${{ inputs.extended-tests }}
        run: python3 scripts/extended_tests.py http://localhost:8080

      - name: Show container logs on failure
        if: failure()
        run: docker logs app