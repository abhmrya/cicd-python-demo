name: pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────── GATE 1: code quality & dependency security ───────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint gate
        run: ruff check .

      - name: Format gate
        run: ruff format --check .

      - name: Unit tests + coverage gate
        run: pytest

      - name: Dependency vulnerability gate
        run: pip-audit -r requirements.txt

  # ─────────── GATE 2: build, scan, publish ───────────
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: app:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan gate (Trivy)
        uses: aquasecurity/trivy-action@0.28.0   # check for the latest release
        with:
          image-ref: app:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # Everything below runs only after a merge to main, not on PRs
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: type=sha,format=long

      - name: Push image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # The digest is the immutable identity of what we tested
      - name: Output image reference by digest
        if: github.event_name != 'pull_request'
        id: ref
        run: echo "image_ref=${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ─────────── PROMOTION: dev → staging → production ───────────
  deploy-dev:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image: ${{ needs.build.outputs.image_ref }}

  deploy-staging:
    needs: [build, deploy-dev]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.build.outputs.image_ref }}
      extended-tests: true

  deploy-production:
    needs: [build, deploy-staging]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml   # pauses for approval via 'production' environment
    with:
      environment: production
      image: ${{ needs.build.outputs.image_ref }}