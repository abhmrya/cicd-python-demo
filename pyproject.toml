[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# GATE: fail the run if coverage drops below 80%
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]   # pycodestyle, pyflakes, isort, bugbear